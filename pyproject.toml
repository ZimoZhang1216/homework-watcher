[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homework-watcher"
version = "0.1.0"
description = "Local macOS homework deadline watcher for Changjiang Yuketang and Xiaoya."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
]

[project.scripts]
hw = "homework_watcher.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["homework_watcher*"]
