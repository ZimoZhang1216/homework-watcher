name: Email homework report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homework-watcher-email-report
  cancel-in-progress: false

jobs:
  email-report:
    name: Send homework report email
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      HW_DB_PATH: ${{ github.workspace }}/.homework-watcher/homework.db
      HW_BROWSER_PROFILE_ROOT: ${{ github.workspace }}/.homework-watcher/browser-profiles
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_SSL: ${{ secrets.SMTP_SSL }}
      SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare app directory
        run: mkdir -p .homework-watcher

      - name: Restore cloud state cache
        uses: actions/cache/restore@v4
        with:
          path: .homework-watcher
          key: homework-watcher-state-${{ github.run_id }}
          restore-keys: |
            homework-watcher-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m playwright install --with-deps chromium

      - name: Validate email secrets
        run: |
          set -euo pipefail
          test -n "${SMTP_HOST:-}" || { echo "Missing GitHub secret: SMTP_HOST"; exit 1; }
          test -n "${SMTP_USERNAME:-}" || { echo "Missing GitHub secret: SMTP_USERNAME"; exit 1; }
          test -n "${SMTP_PASSWORD:-}" || { echo "Missing GitHub secret: SMTP_PASSWORD"; exit 1; }
          test -n "${EMAIL_TO:-}" || { echo "Missing GitHub secret: EMAIL_TO"; exit 1; }

      - name: Scan platforms
        run: |
          set -euo pipefail
          timeout 18m python -m homework_watcher scan --no-notify || {
            status=$?
            if [ "$status" -eq 124 ]; then
              echo "::warning::Platform scan timed out after 18 minutes. Sending email report from cached database and fixed weekly assignments."
            else
              echo "::warning::Platform scan failed with exit code $status. Sending email report from cached database and fixed weekly assignments."
            fi
          }

      - name: Preview email report
        run: python -m homework_watcher email-report --dry-run

      - name: Send email report
        run: python -m homework_watcher email-report

      - name: Save cloud state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .homework-watcher
          key: homework-watcher-state-${{ github.run_id }}
