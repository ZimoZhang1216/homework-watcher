name: Sync iCloud Calendar

on:
  workflow_dispatch:
    inputs:
      run_scan:
        description: Try to scan platforms before syncing. Requires a valid browser login state on the runner.
        required: true
        default: false
        type: boolean
      platform:
        description: Platform to scan when run_scan is enabled.
        required: true
        default: all
        type: choice
        options:
          - all
          - changjiang-yuketang
          - xiaoya
  schedule:
    # 08:00 Asia/Shanghai.
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: homework-watcher-icloud-calendar
  cancel-in-progress: false

jobs:
  sync:
    name: Sync homework deadlines to iCloud Calendar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      HW_DB_PATH: ${{ github.workspace }}/.homework-watcher/homework.db
      ICLOUD_USERNAME: ${{ secrets.ICLOUD_USERNAME }}
      ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
      ICLOUD_CALENDAR_NAME: ${{ vars.ICLOUD_CALENDAR_NAME }}
      ICLOUD_CALDAV_URL: ${{ vars.ICLOUD_CALDAV_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare app directory
        run: mkdir -p .homework-watcher

      - name: Restore homework database cache
        uses: actions/cache/restore@v4
        with:
          path: .homework-watcher
          key: homework-watcher-db-${{ github.run_id }}
          restore-keys: |
            homework-watcher-db-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Validate iCloud secrets
        run: |
          set -euo pipefail
          test -n "${ICLOUD_USERNAME:-}" || { echo "Missing GitHub secret: ICLOUD_USERNAME"; exit 1; }
          test -n "${ICLOUD_APP_PASSWORD:-}" || { echo "Missing GitHub secret: ICLOUD_APP_PASSWORD"; exit 1; }

      - name: Install Playwright browser for optional scan
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_scan }}
        run: python -m playwright install chromium

      - name: Optional platform scan
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_scan }}
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = "all" ]; then
            python -m homework_watcher scan
          else
            python -m homework_watcher scan "$PLATFORM"
          fi

      - name: Sync to iCloud Calendar
        run: |
          set -euo pipefail
          mkdir -p .homework-watcher
          CALENDAR_NAME="${ICLOUD_CALENDAR_NAME:-作业提醒-iCloud}"
          CALDAV_URL="${ICLOUD_CALDAV_URL:-https://caldav.icloud.com}"
          python -m homework_watcher check \
            --icloud-calendar-sync \
            --icloud-calendar-name "$CALENDAR_NAME" \
            --icloud-caldav-url "$CALDAV_URL" \
            --no-notify

      - name: Save homework database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .homework-watcher
          key: homework-watcher-db-${{ github.run_id }}
