name: Scan homework

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to scan.
        required: true
        default: all
        type: choice
        options:
          - all
          - changjiang-yuketang
          - xiaoya
      run_check:
        description: Run local reminder check after scanning.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: homework-watcher-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan homework platforms
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install .
          .venv/bin/python -m playwright install chromium

      - name: Configure local app paths
        run: |
          mkdir -p "$HOME/.homework-watcher"
          echo "HW_DB_PATH=$HOME/.homework-watcher/homework.db" >> "$GITHUB_ENV"

      - name: Scan platforms
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = "all" ]; then
            .venv/bin/python -m homework_watcher scan
          else
            .venv/bin/python -m homework_watcher scan "$PLATFORM"
          fi

      - name: Run reminder check
        if: ${{ inputs.run_check }}
        run: .venv/bin/python -m homework_watcher check
