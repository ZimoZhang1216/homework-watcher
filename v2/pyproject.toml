[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homework-watcher-v2"
version = "2.7.0"
description = "Stable homework reminder website with Playwright scanners."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "playwright>=1.45",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
hw-v2 = "homework_watcher.cli:main"
hw-v2-web = "homework_watcher.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["homework_watcher*"]
